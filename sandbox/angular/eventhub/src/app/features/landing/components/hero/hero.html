<section class="col-lg-5 hero-col" [class.started]="started()">
    <h1 class="display-3 fw-bold lh-sm mb-4 glow-title">Plan.<br />Register.<br />Connect.</h1>
    <p class="fs-5 text-secondary fst-italic">
        One platform for corporate events — sign in to access your space.
    </p>

    @if (!started()) {
    <button type="button" class="btn btn-info btn-lg mt-3 px-5 py-2.5 fw-bold text-dark get-started-btn"
        (click)="getStarted.emit()">
        Get Started
    </button>
    }
</section>
