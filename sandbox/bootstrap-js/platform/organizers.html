<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Organizers</title>
    <meta name="description" content="Plan, register, and connect your corporate events with EventHub. The all-in-one event management platform for enterprise organizations, organizers, and attendees.">
    
    <!-- Bootstrap 5.3.8 CSS CDN -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    
    <!-- External Shared Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <!-- Migrated Separate Stylesheet Component -->
    <link rel="stylesheet" href="../css/platform/organizers.css">
</head>
<body>

    <!-- Nav Bar Section (Always expanded, no hamburger) -->
    <header class="navbar glass-nav navbar-dark sticky-top">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            
            <!-- Logo -->
            <a href="#" class="navbar-brand fw-bold text-white fs-5 m-0" style="transition: color 0.3s ease;">EventHub</a>
            
            <!-- Navigation Items (Always inline on all screens) -->
            <div class="d-flex align-items-center gap-2 gap-sm-3 text-secondary" style="font-size: 0.85rem;">
                
                <!-- Role Badge -->
                <span class="text-white-50 text-nowrap">Platform Owner</span>
                <span class="text-muted">|</span>
                
                <!-- Interactive Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-link dropdown-toggle fw-semibold text-white p-0 border-0 text-decoration-none" 
                            type="button" 
                            id="adminDropdown" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false" 
                            style="font-size: 0.85rem; box-shadow: none;">
                        Jane Dela Cruz
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark bg-dark border-secondary mt-2" aria-labelledby="adminDropdown">
                        <li><a class="dropdown-item py-2" href="#" style="font-size: 0.85rem;">System Config</a></li>
                        <li><a class="dropdown-item py-2" href="#" style="font-size: 0.85rem;">Activity Logs</a></li>
                        <li><hr class="dropdown-divider border-secondary"></li>
                        <li>
                            <a class="dropdown-item py-2 text-danger" href="../index.html" style="font-size: 0.85rem;">Log Out</a>
                        </li>
                    </ul>
                </div>
                
            </div>
        </div>
    </header>

    <!-- Master Layout Wrapper -->
    <div class="container-fluid p-0 d-flex flex-column flex-md-row align-items-stretch">
        
        <!-- Side Bar Navigation -->
        <aside class="sidebar p-3 p-md-4 flex-shrink-0">
            <nav class="nav flex-column gap-2">
                <a href="dashboard.html" class="nav-item rounded">Dashboard</a>
                <a href="#" class="nav-item rounded active">Organizers</a>
                <a href="billing.html" class="nav-item rounded">Billing & Invoices</a>
                <a href="tickets.html" class="nav-item rounded">Tickets & Requests</a>
            </nav>
        </aside>

        <!-- Main Dashboard Workspace -->
        <main class="flex-grow-1 p-4 p-lg-5" style="max-width: 1400px; margin: 0 auto; width: 100%;">
            <h1 class="h2 fw-bold text-white mb-4">Organizers</h1>

            <!-- Filters Layer using Bootstrap Grid Row configurations -->
            <form class="row g-3 align-items-end mb-4" id="companyFilterForm" onsubmit="event.preventDefault();">
                <div class="col-md-7 col-lg-8">
                    <label for="searchCompany" class="form-label small text-secondary">Search by company name</label>
                    <input type="text" id="searchCompany" class="form-control glass-form-input">
                </div>
                <div class="col-md-3 col-lg-2">
                    <div class="dropdown" id="statusFilterDropdown">
                        <!-- Dropdown Toggle Button -->
                        <button 
                            class="btn glass-form-input dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" 
                            type="button" 
                            id="statusFilterBtn" 
                            data-bs-toggle="dropdown" 
                            data-value="All" 
                            aria-expanded="false">
                            <span>All</span>
                        </button>

                        <!-- Dropdown Items Menu -->
                        <ul class="dropdown-menu dropdown-menu-dark w-100 shadow" aria-labelledby="statusFilterBtn">
                            <li><a class="dropdown-item active" href="#" data-value="All">All</a></li>
                            <li><a class="dropdown-item" href="#" data-value="Active">Active</a></li>
                            <li><a class="dropdown-item" href="#" data-value="Suspended">Suspended</a></li>
                            <li><a class="dropdown-item" href="#" data-value="Pending">Pending</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-2">
                    <!-- Global custom dark theme button referenced inside global components -->
                    <button type="submit" class="btn btn-dark w-100 fw-semibold tracking-wide" style="height: 42px;">Search</button>
                </div>
            </form>

            <!-- Table Contents with Responsive Wrapped Container Layer -->
            <div class="glass-table-responsive rounded-3">
                <table class="table glass-data-table mb-0 align-middle" id="companiesTable">
                    <thead>
                        <tr>
                            <th scope="col">Company Name</th>
                            <th scope="col"># Events</th>
                            <th scope="col">Status</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="companyTableBody">
                        
                    </tbody>
                </table>
            </div>

            <!-- Custom Glassmorphic Pagination System
            <div class="d-flex flex-column align-items-center mt-2 mb-3">
                <div class="d-flex justify-content-center w-100">
                    <nav class="custom-pagination-container justify-content-center align-items-center" id="pagination-controls" aria-label="Page Navigation">
                        <ul class="pagination mb-0" id="pagination-list"></ul>
                    </nav>
                </div>
                <small id="pagination-info" class="text-white-50 text-center mt-2">
                    Showing 0 to 0 of 0 entries
                </small>
            </div> -->

            <!-- Pagination Section -->
            <div class="d-flex flex-column align-items-center mt-2 mb-3">
                <div class="d-flex justify-content-center w-100">
                    <nav class="custom-pagination-container" aria-label="Page Navigation">
                        <!-- Previous Button -->
                        <a href="#" class="custom-page-link page-control" id="prevPageBtn" tabindex="-1" aria-disabled="true">« Prev</a>
                        
                        <!-- Dynamic Page Numbers -->
                        <div class="custom-page-numbers-wrapper" id="pageNumbersContainer"></div>
                        
                        <!-- Next Button -->
                        <a href="#" class="custom-page-link page-control" id="nextPageBtn">Next »</a>
                    </nav>
                </div>
                <small id="pagination-info" class="text-white-50 text-center mt-2">
                    Showing 0 to 0 of 0 entries
                </small>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5.3.8 JS Bundle CDN -->
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/organizer/organizer_table.js"></script>
</body>
</html>
