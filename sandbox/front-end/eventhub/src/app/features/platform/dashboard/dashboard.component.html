<h1 class="h2 fw-bold text-white mb-4">Platform Dashboard</h1>

<!-- Metrics Cards Row -->
<section class="row g-3 g-md-4 mb-4">
  <div class="col-md-6">
    <app-metric-card [value]="organizersCount" label="Total Organizers"></app-metric-card>
  </div>
  <div class="col-md-6">
    <app-metric-card [value]="eventsCount" label="Total Events (This Year)"></app-metric-card>
  </div>
</section>

<!-- Chart Panel -->
<section class="mb-4">
  <app-chart-panel 
    title="Events per Month" 
    [data]="monthlyEventsData">
  </app-chart-panel>
</section>

<!-- Action Grid Controls -->
<section class="row g-3 p-4 rounded-3 align-items-center action-grid-section">
  <div class="col-md-4">
    <app-action-card label="View Organizers" routerLink="/platform-owner/organizers"></app-action-card>
  </div>
  <div class="col-md-4">
    <app-action-card label="View Billing" routerLink="/platform-owner/billing"></app-action-card>
  </div>
  <div class="col-md-4">
    <app-action-card label="View Tickets" routerLink="/platform-owner/tickets"></app-action-card>
  </div>
</section>
