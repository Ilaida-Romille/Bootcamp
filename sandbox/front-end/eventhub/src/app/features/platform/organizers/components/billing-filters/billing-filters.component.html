<!-- features/billing/components/billing-filters/billing-filters.component.html -->
<form class="row g-3 align-items-end mb-4" (ngSubmit)="emitFilter()">
  <div class="col-md-7 col-lg-8">
    <label for="searchCompany" class="form-label small text-secondary">Search by company name or invoice ID</label>
    <input 
      type="text" 
      id="searchCompany" 
      class="form-control glass-form-input" 
      [(ngModel)]="searchTerm" 
      name="searchTerm"
      placeholder="Type company name...">
  </div>

  <div class="col-md-3 col-lg-2">
    <div class="dropdown" [class.show]="isDropdownOpen">
      <button 
        class="btn glass-form-input dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" 
        type="button" 
        (click)="toggleDropdown()">
        <span>{{ selectedStatus }}</span>
      </button>

      <ul class="dropdown-menu dropdown-menu-dark w-100 shadow" [class.show]="isDropdownOpen">
        @for (status of statusOptions; track status) {
          <li>
            <a class="dropdown-item" [class.active]="selectedStatus === status" href="javascript:void(0)" (click)="selectStatus(status)">
              {{ status }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>

  <div class="col-md-2">
    <button type="submit" class="btn btn-dark w-100 fw-semibold tracking-wide" style="height: 42px;">
      Search
    </button>
  </div>
</form>
