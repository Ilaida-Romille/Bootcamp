<!-- features/billing/components/billing-table/billing-table.component.html -->
<div class="glass-table-responsive rounded-3">
  <table class="table glass-data-table mb-0 align-middle">
    <thead>
      <tr>
        <th scope="col">Invoice ID</th>
        <th scope="col">Company Name</th>
        <th scope="col">Amount</th>
        <th scope="col">Due Date</th>
        <th scope="col">Status</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let invoice of invoices">
        <td class="fw-semibold">{{ invoice.id }}</td>
        <td>{{ invoice.companyName }}</td>
        <td>{{ invoice.amount | currency }}</td>
        <td>{{ invoice.dueDate }}</td>
        <td>
          <span [ngClass]="getStatusBadgeClass(invoice.status)" class="fw-semibold">
            {{ invoice.status }}
          </span>
        </td>
        <td class="actions-cell">
          <a href="javascript:void(0)" (click)="viewInvoice.emit(invoice.id)">View</a>
          <span class="action-divider">|</span>
          <a href="javascript:void(0)" (click)="downloadInvoice.emit(invoice.id)">Download</a>
        </td>
      </tr>
      <tr *ngIf="invoices.length === 0">
        <td colspan="6" class="text-center text-muted py-4">No records found.</td>
      </tr>
    </tbody>
  </table>
</div>
