<h1 class="h2 fw-bold text-white mb-4">Organizers</h1>

<div *ngIf="dataLoadingError" class="alert alert-danger" role="alert">
  {{ dataLoadingError }}
</div>

<!-- Filters Layer using Bootstrap Grid Row configurations -->
<form class="row g-3 align-items-end mb-4" id="companyFilterForm" (submit)="$event.preventDefault(); applyFilter()">
  <div class="col-md-7 col-lg-8">
    <label for="searchCompany" class="form-label small text-secondary">Search by company name</label>
    <input 
      type="text" 
      id="searchCompany" 
      class="form-control glass-form-input"
      [value]="searchTerm"
      (input)="onSearchChange($event)"
      placeholder="Enter company name...">
  </div>

  <div class="col-md-3 col-lg-2">
    <div class="dropdown" id="statusFilterDropdown" [class.show]="isDropdownOpen">
      <!-- Dropdown Toggle Button -->
      <button 
        class="btn glass-form-input dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" 
        type="button" 
        id="statusFilterBtn" 
        (click)="toggleDropdown()"
        [attr.aria-expanded]="isDropdownOpen">
        <span>{{ selectedStatus }}</span>
      </button>

      <!-- Dropdown Items Menu -->
      <ul class="dropdown-menu dropdown-menu-dark w-100 shadow" [class.show]="isDropdownOpen" aria-labelledby="statusFilterBtn">
        <li *ngFor="let status of statusOptions">
          <a 
            class="dropdown-item" 
            [class.active]="selectedStatus === status" 
            href="javascript:void(0)" 
            (click)="selectStatus(status)">
            {{ status }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="col-md-2">
    <button type="submit" class="btn btn-dark w-100 fw-semibold tracking-wide" style="height: 42px;">
      Search
    </button>
  </div>
</form>

<!-- Table Contents -->
<div class="glass-table-responsive rounded-3">
  <table class="table glass-data-table mb-0 align-middle" id="companiesTable">
    <thead>
      <tr>
        <th scope="col">Company Name</th>
        <th scope="col"># Events</th>
        <th scope="col">Status</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody id="companyTableBody">
      <!-- Use paginatedCompanies here instead of filteredCompanies -->
      <tr *ngFor="let company of paginatedCompanies">
        <td class="fw-semibold">{{ company.name }}</td>
        <td>{{ company.eventsCount }}</td>
        <td>
          <span [ngClass]="getStatusBadgeClass(company.status)" class="fw-semibold">
            {{ company.status }}
          </span>
        </td>
        <td class="actions-cell">
          <a href="javascript:void(0)">View</a>
          <span class="action-divider">|</span>
          <a href="javascript:void(0)">Edit</a>
        </td>
      </tr>
      <tr *ngIf="filteredCompanies.length === 0">
        <td colspan="4" class="text-center text-muted py-4">No organizers found.</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Replaced static HTML with <app-pagination> -->
<app-pagination
  [currentPage]="currentPage"
  [totalItems]="filteredCompanies.length"
  [itemsPerPage]="itemsPerPage"
  (pageChange)="onPageChange($event)">
</app-pagination>
