<h1 class="h2 fw-bold text-white mb-4">Tickets & Requests</h1>

<!-- Workspace Layout Grid Row -->
<div class="row g-4 align-items-start">
    
    <!-- Ticket List Queue Column -->
    <div class="col-100-lg-350 col-100-md-100">
        <div class="glass-tickets-list rounded-3">
            @for (ticket of tickets; track ticket.id) {
              <app-ticket-list-item
                  [ticket]="ticket"
                  [isSelected]="selectedTicket?.id === ticket.id"
                  (selectTicket)="selectTicket($event)">
              </app-ticket-list-item>
            }
        </div>
    </div>

    <!-- Ticket Inspection Detail View Panel Column -->
    <div class="col-grow-panel">
        <app-ticket-detail
            [ticket]="selectedTicket"
            (responseSubmitted)="handleResponseSubmitted($event)"
            (statusChanged)="handleStatusChanged($event)">
        </app-ticket-detail>
    </div>

</div>
