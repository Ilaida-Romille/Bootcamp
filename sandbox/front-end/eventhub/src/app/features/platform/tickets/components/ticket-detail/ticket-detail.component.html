<div class="glass-ticket-detail p-4 rounded-3" *ngIf="ticket; else noTicketSelected">
  <h2 class="h5 fw-bold text-white mb-2">#{{ ticket.ticketNumber }} — {{ ticket.subject }}</h2>
  
  <div class="small text-secondary mb-4">
    From: <span class="fw-medium text-white">{{ ticket.companyName }}</span> 
    <span class="dot-divider">•</span> Opened: {{ ticket.openedTimeAgo }} 
    <span class="dot-divider">•</span> Status: 
    <span [ngClass]="{
      'text-success': ticket.status === 'Resolved',
      'text-warning': ticket.status === 'Open' || ticket.status === 'In Progress',
      'text-secondary': ticket.status === 'Closed'
    }" class="fw-medium">
      {{ ticket.status }}
    </span>
  </div>

  <!-- Ticket Message Box Row -->
  <div class="message-display-box rounded-2 mb-4">
    <p class="mb-0 message-quote">“{{ ticket.message }}”</p>
  </div>

  <!-- Interactive Feedback Form -->
  <form (submit)="$event.preventDefault(); sendResponse()">
    <div class="mb-3">
      <label for="userResponse" class="form-label small text-secondary mb-2">Your Response</label>
      <textarea 
        id="userResponse" 
        class="form-control glass-form-textarea"
        [(ngModel)]="userResponse"
        name="userResponse"
        placeholder="Type your reply here...">
      </textarea>
    </div>
    
    <!-- Action Triggers -->
    <div class="d-flex flex-column flex-lg-row gap-3">
      <button 
        type="submit" 
        class="btn btn-dark fw-semibold px-lg-4 custom-action-btn"
        [disabled]="!userResponse.trim()">
        Send Response
      </button>
      <button 
        type="button" 
        class="btn btn-glass-outline fw-semibold px-lg-4 custom-action-btn"
        (click)="markResolved()"
        [disabled]="ticket.status === 'Resolved'">
        Mark Resolved
      </button>
    </div>
  </form>
</div>

<ng-template #noTicketSelected>
  <div class="glass-ticket-detail p-5 rounded-3 text-center text-muted">
    <p class="mb-0">Select a ticket from the queue to view details.</p>
  </div>
</ng-template>
