<div 
  class="ticket-item" 
  [class.active]="isSelected" 
  (click)="onSelect()">
  
  <div class="ticket-meta d-flex align-items-center justify-content-between">
    <span class="fw-semibold">#{{ ticket.ticketNumber }}</span>
    <span class="badge" [ngClass]="getPriorityBadgeClass(ticket.priority)">
      {{ ticket.priority }}
    </span>
  </div>
  
  <div class="ticket-company">{{ ticket.companyName }}</div>
  <div class="ticket-subject text-truncate">{{ ticket.subject }}</div>
</div>
