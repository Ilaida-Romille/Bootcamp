<main class="p-4 p-lg-5" style="max-width: 1400px; margin: 0 auto; width: 100%;">
  <header class="mb-4">
    <h1 class="h2 fw-bold text-white mb-1">Welcome back, {{ companyName }}</h1>
    <p class="small text-secondary italic-subtitle mb-0">What would you like to do today?</p>
  </header>

  <!-- Features Grid Layout -->
  <section class="row g-4 matches-features-grid">
    @for (feature of featureNodes; track feature) {
      <div class="col-md-6 col-xl-6 d-flex">
        <app-feature-card 
          [data]="feature" 
          (cardClick)="onCardAction($event)" 
          class="w-100">
        </app-feature-card>
      </div>
    }
  </section>
</main>
