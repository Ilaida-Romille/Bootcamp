<aside class="sidebar p-3 p-md-4 flex-shrink-0">
  <nav class="nav flex-column gap-2">
    <a 
      *ngFor="let item of navItems" 
      href="#" 
      class="nav-item rounded" 
      [class.active]="item.active"
      (click)="onDummyClick($event)">
      {{ item.label }}
    </a>
  </nav>
</aside>
