<main class="custom-attendee-container">
  <h1 class="custom-page-title">Upcoming Events</h1>

  @if (dataLoadingError) {
    <div class="alert alert-danger" role="alert">
      {{ dataLoadingError }}
    </div>
  }

  <!-- Filter Bar -->
  <div class="filter-bar mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-lg-4">
        <label class="form-label" for="eventSearch">Search</label>
        <input
          id="eventSearch"
          name="eventSearch"
          type="text"
          class="form-control glass-form-input"
          [(ngModel)]="searchTerm"
          (ngModelChange)="applyFilters()"
          placeholder="Title, venue, or organizer" />
      </div>

      <div class="col-6 col-lg-3">
        <label class="form-label" for="statusFilter">Status</label>
        <select
          id="statusFilter"
          name="statusFilter"
          class="form-select glass-form-input"
          [(ngModel)]="selectedStatus"
          (ngModelChange)="applyFilters()">
          @for (option of statusOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </div>

      <div class="col-6 col-lg-3">
        <label class="form-label" for="organizerFilter">Organizer</label>
        <select
          id="organizerFilter"
          name="organizerFilter"
          class="form-select glass-form-input"
          [(ngModel)]="selectedOrganizer"
          (ngModelChange)="applyFilters()">
          @for (option of organizerOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-lg-2">
        <button type="button" class="btn btn-dark w-100" (click)="clearFilters()">
          <i class="bi bi-arrow-clockwise"></i> Reset
        </button>
      </div>
    </div>
  </div>

  <small class="text-secondary d-block mb-3">
    <i class="bi bi-info-circle"></i> Showing <strong>{{ filteredEvents.length }}</strong> event(s)
  </small>

  <!-- Grid for events cards -->
  <section class="row g-4 matches-events-grid" id="eventsGridContainer">
    @for (eventItem of paginatedEvents; track eventItem.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-event-card [event]="eventItem"></app-event-card>
      </div>
    }
  </section>

  <!-- Pagination Section -->
  <div class="d-flex justify-content-center">
    <nav class="custom-pagination-container" aria-label="Page Navigation">
      
      <button 
        type="button" 
        class="custom-page-link page-control" 
        [class.page-disabled]="currentPage === 1"
        [disabled]="currentPage === 1"
        (click)="setPage(currentPage - 1)">
        « Prev
      </button>
      
      <div class="custom-page-numbers-wrapper">
        @for (page of pages; track page) {
          <button 
            type="button"
            class="custom-page-link" 
            [class.page-active]="page === currentPage"
            (click)="setPage(page)">
            {{ page }}
          </button>
        }
      </div>
      
      <button 
        type="button" 
        class="custom-page-link page-control" 
        [class.page-disabled]="currentPage === totalPages"
        [disabled]="currentPage === totalPages"
        (click)="setPage(currentPage + 1)">
        Next »
      </button>
      
    </nav>
  </div>
</main>
