<main class="custom-workspace-container">
  <div class="row g-4 align-items-start matches-workspace-grid">
    
    <!-- Timeline Section -->
    <section class="col-grow-panel">
      <app-agenda-timeline [items]="agendaItems"></app-agenda-timeline>
    </section>

    <!-- Sidebar Widgets Section -->
    <section class="col-100-lg-380 col-100-md-100 sidebar-widgets-panel">
      <app-attendee-list-widget [attendees]="attendees"></app-attendee-list-widget>
      <app-venue-map-widget></app-venue-map-widget>
      <app-contact-organizer-widget></app-contact-organizer-widget>
    </section>

  </div>
</main>
