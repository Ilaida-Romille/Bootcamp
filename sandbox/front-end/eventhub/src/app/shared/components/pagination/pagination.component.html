<div class="d-flex flex-column align-items-center mt-4 mb-3">
  <div class="d-flex justify-content-center w-100">
    <nav class="custom-pagination-container" aria-label="Page Navigation">
      
      <!-- Previous Button -->
      <a 
        href="javascript:void(0)" 
        class="custom-page-link page-control" 
        [class.page-disabled]="currentPage === 1"
        (click)="selectPage(currentPage - 1)">
        « Prev
      </a>

      <!-- Page Numbers -->
      <div class="custom-page-numbers-wrapper d-flex gap-1">
        <a 
          *ngFor="let page of pages" 
          href="javascript:void(0)" 
          class="custom-page-link"
          [class.page-active]="page === currentPage"
          (click)="selectPage(page)">
          {{ page }}
        </a>
      </div>

      <!-- Next Button -->
      <a 
        href="javascript:void(0)" 
        class="custom-page-link page-control" 
        [class.page-disabled]="currentPage === totalPages"
        (click)="selectPage(currentPage + 1)">
        Next »
      </a>

    </nav>
  </div>

  <small class="text-white-50 text-center mt-2">
    Showing {{ startItem }} to {{ endItem }} of {{ totalItems }} entries
  </small>
</div>
