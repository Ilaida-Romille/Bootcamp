<header class="navbar navbar-expand-md glass-nav navbar-dark sticky-top">
    <div class="container-xl">
        <span class="navbar-brand fw-bold text-white fs-4">EventHub</span>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
            <!-- Role-based Navigation Items -->
            <nav class="navbar-nav gap-3 mt-3 mt-md-0">
                @for (item of navItems; track item.label) {
                  <span class="nav-link text-secondary">
                      {{ item.label }}
                  </span>
                }
            </nav>

            <!-- User Dropdown Section -->
            @if (currentRole && !isOnLandingPage) {
              <div class="navbar-nav mt-3 mt-md-0">
                <div class="nav-item dropdown">
                    <button 
                        class="btn btn-link nav-link dropdown-toggle text-secondary"
                        type="button"
                        id="userDropdown"
                        (click)="toggleDropdown()"
                        aria-expanded="false">
                        {{ dropdownLabel }}
                    </button>
                    <ul class="dropdown-menu" 
                        [ngClass]="{ 'show': dropdownOpen }"
                        aria-labelledby="userDropdown">
                        <li>
                            <button
                                type="button"
                                (click)="openProfile()"
                                class="dropdown-item">
                                My Profile
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button 
                                type="button"
                                (click)="onLogout()"
                                class="dropdown-item text-danger">
                                Logout
                            </button>
                        </li>
                    </ul>
                </div>
              </div>
            }
        </div>
    </div>
</header>
