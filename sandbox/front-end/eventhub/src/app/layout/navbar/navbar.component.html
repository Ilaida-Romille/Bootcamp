<header class="navbar navbar-expand-md glass-nav navbar-dark sticky-top">
    <div class="container-xl">
        <a href="#" class="navbar-brand fw-bold text-white fs-4">EventHub</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
            <!-- Role-based Navigation Items -->
            <nav class="navbar-nav gap-3 mt-3 mt-md-0">
                <span *ngFor="let item of navItems" 
                   
                   class="nav-link text-secondary">
                    {{ item.label }}
                </span>
            </nav>

            <!-- User Dropdown Section -->
            <div class="navbar-nav mt-3 mt-md-0" *ngIf="currentRole">
                <div class="nav-item dropdown">
                    <button 
                        class="btn btn-link nav-link dropdown-toggle text-secondary"
                        type="button"
                        id="userDropdown"
                        (click)="toggleDropdown()"
                        aria-expanded="false">
                        {{ dropdownLabel }}
                    </button>
                    <ul class="dropdown-menu" 
                        [ngClass]="{ 'show': dropdownOpen }"
                        aria-labelledby="userDropdown">
                        <li>
                            <button 
                                type="button"
                                (click)="onLogout()"
                                class="dropdown-item">
                                Logout
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>
