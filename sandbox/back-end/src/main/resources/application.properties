spring.application.name=eventhubri

# ============================================================
# Database (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/eventhubris?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ============================================================
# JPA Auditing
# ============================================================
# Your BaseEntity uses @CreatedDate and @LastModifiedDate.
# JpaAuditingConfig in the supplied implementation enables them.


# ============================================================
# JWT Security
# ============================================================
app.security.jwt.secret-base64=c3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLXNpZ25pbmctbXVzdC1iZS1sb25nLWVub3VnaCE=
app.security.jwt.issuer=eventhubri

# Access token lifetime
app.security.jwt.access-token-minutes=15

# Refresh token lifetime
app.security.jwt.refresh-token-days=7


# ============================================================
# Refresh Token Cleanup
# Runs every 6 hours
# ============================================================
app.security.refresh-token-cleanup-cron=0 0 */6 * * *


# ============================================================
# Server
# ============================================================
server.port=8080